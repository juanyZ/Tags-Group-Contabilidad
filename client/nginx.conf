# Servidor estatico del frontend compilado.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # No revelar la version de nginx.
  server_tokens off;

  # Cabeceras de seguridad. La API tiene las suyas (helmet); estas protegen a
  # quien sirve el HTML.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # CSP acotada: la app no carga nada de terceros. 'unsafe-inline' en style-src
  # es necesario porque React aplica estilos en linea en algunos componentes.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:4000; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Los assets con hash en el nombre se pueden cachear para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # El index NO se cachea: es lo que apunta a los assets nuevos tras un deploy.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA: cualquier ruta desconocida devuelve el index y resuelve React Router.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
